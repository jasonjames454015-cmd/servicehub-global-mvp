<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin</title><link rel="stylesheet" href="../css/app.css"></head><body><header><a class="logo" href="../index.html">ServiceHub Global</a></header><main class="wrap"><h1>Admin (local)</h1><p id="s"></p><button class="btn" id="exp">Download JSON</button> <button class="btn btn-outline" id="wipe">Wipe local data</button></main><script src="../js/store.js"></script><script>document.getElementById("s").textContent=JSON.stringify(SHG.stats());document.getElementById("exp").onclick=function(){const b=new Blob([JSON.stringify(SHG.load(),null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="servicehub-local.json";a.click();};document.getElementById("wipe").onclick=function(){if(confirm("Wipe?")){localStorage.removeItem("shg_v1");location.reload();}};</script></body></html>
