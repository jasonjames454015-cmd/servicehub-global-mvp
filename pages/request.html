<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create request</title><link rel="stylesheet" href="../css/app.css"></head><body><header><a class="logo" href="../index.html">ServiceHub Global</a><nav><a href="dashboard.html">Dashboard</a></nav></header><main class="wrap" style="max-width:640px;"><h1>Create a service request</h1><p class="muted">Stored in this browser only.</p><p class="ok" id="ok">Request saved locally.</p><form id="f"><label for="category">Category</label><select id="category" required><option value="">Select</option><option>AI Automation / Lead Systems</option><option>Website & Local SEO</option><option>Content & Social</option><option>Data Cleanup</option><option>Virtual Assistant</option><option>Other</option></select><label for="title">Title</label><input id="title" required><label for="details">Details</label><textarea id="details" required></textarea><label for="location">Location</label><input id="location"><label for="budget">Budget</label><select id="budget"><option value="">Prefer not to say</option><option>Under $200</option><option>$200 – $500</option><option>$500 – $1,500</option><option>$1,500+</option></select><button class="btn" type="submit" style="margin-top:1.2rem;width:100%;">Save request</button></form></main><script src="../js/store.js"></script><script>document.getElementById("f").onsubmit=function(e){e.preventDefault();SHG.addRequest({category:category.value,title:title.value,details:details.value,location:location.value,budget:budget.value});document.getElementById("ok").style.display="block";this.reset();};</script></body></html>
