<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Request – ServiceHub Global</title>
  <style>
    :root { --primary: #0f766e; --bg: #f8fafc; --text: #0f172a; --muted: #64748b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    header { background: white; border-bottom: 1px solid #e2e8f0; padding: 1rem 1.5rem; }
    .logo { font-weight: 700; color: var(--primary); text-decoration: none; }
    main { max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: 0.5rem; }
    p.lead { color: var(--muted); margin-bottom: 2rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.35rem; margin-top: 1.25rem; }
    input, select, textarea { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; font-size: 1rem; }
    textarea { min-height: 120px; resize: vertical; }
    button { margin-top: 1.5rem; background: var(--primary); color: white; border: none; padding: 0.85rem 1.75rem; border-radius: 0.5rem; font-weight: 600; cursor: pointer; width: 100%; }
    button:hover { background: #0d5c56; }
    .note { font-size: 0.875rem; color: var(--muted); margin-top: 1rem; }
  </style>
</head>
<body>
  <header>
    <a href="../index.html" class="logo">ServiceHub Global</a>
  </header>
  <main>
    <h1>Create a service request</h1>
    <p class="lead">Describe what you need. Matching providers will be able to respond (MVP mock – no backend yet).</p>
    
    <form onsubmit="event.preventDefault(); alert('Request captured locally for MVP testing. Full matching & messaging coming with backend.');">
      <label for="category">Service category</label>
      <select id="category" required>
        <option value="">Select category</option>
        <option>AI Automation / Lead Systems</option>
        <option>Website & Local SEO</option>
        <option>Content & Social Media Systems</option>
        <option>Data Cleanup & Spreadsheets</option>
        <option>Virtual Assistant / Admin</option>
        <option>Other</option>
      </select>

      <label for="title">Request title</label>
      <input type="text" id="title" placeholder="e.g. Automated lead follow-up for my HVAC business" required>

      <label for="details">Details</label>
      <textarea id="details" placeholder="Describe the problem, current tools, desired outcome, timeline..." required></textarea>

      <label for="location">Location / timezone preference</label>
      <input type="text" id="location" placeholder="City, Country or Remote">

      <label for="budget">Budget range (optional)</label>
      <select id="budget">
        <option value="">Prefer not to say</option>
        <option>Under $200</option>
        <option>$200 – $500</option>
        <option>$500 – $1,500</option>
        <option>$1,500+</option>
      </select>

      <button type="submit">Submit request (MVP)</button>
    </form>
    <p class="note">This is a frontend mock. No data is stored on a server yet. When accounts and backend are live, requests will be saved, matched, and visible in dashboards.</p>
  </main>
</body>
</html>
