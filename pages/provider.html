<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Provider Onboarding – ServiceHub Global</title>
  <style>
    :root { --primary: #0f766e; --bg: #f8fafc; --text: #0f172a; --muted: #64748b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    header { background: white; border-bottom: 1px solid #e2e8f0; padding: 1rem 1.5rem; }
    .logo { font-weight: 700; color: var(--primary); text-decoration: none; }
    main { max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: 0.5rem; }
    p.lead { color: var(--muted); margin-bottom: 2rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.35rem; margin-top: 1.25rem; }
    input, select, textarea { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; font-size: 1rem; }
    textarea { min-height: 100px; resize: vertical; }
    button { margin-top: 1.5rem; background: var(--primary); color: white; border: none; padding: 0.85rem 1.75rem; border-radius: 0.5rem; font-weight: 600; cursor: pointer; width: 100%; }
    button:hover { background: #0d5c56; }
    .note { font-size: 0.875rem; color: var(--muted); margin-top: 1rem; }
  </style>
</head>
<body>
  <header>
    <a href="../index.html" class="logo">ServiceHub Global</a>
  </header>
  <main>
    <h1>Become a provider</h1>
    <p class="lead">Create your profile so customers can find and contact you (MVP mock).</p>
    
    <form onsubmit="event.preventDefault(); alert('Provider profile captured locally for MVP testing. Full onboarding & matching coming with backend.');">
      <label for="name">Display name / Business name</label>
      <input type="text" id="name" required>

      <label for="categories">Primary categories (select main one for now)</label>
      <select id="categories" required>
        <option value="">Select</option>
        <option>AI Automation & Lead Systems</option>
        <option>Websites & Local SEO</option>
        <option>Content & Social Systems</option>
        <option>Data / Spreadsheet Work</option>
        <option>Virtual Assistance</option>
        <option>Other professional services</option>
      </select>

      <label for="bio">Short bio / what you deliver</label>
      <textarea id="bio" placeholder="2-4 sentences describing your focus and typical outcomes" required></textarea>

      <label for="location">Location / Remote</label>
      <input type="text" id="location" placeholder="City, Country or Fully Remote">

      <label for="rate">Typical rate range (optional)</label>
      <input type="text" id="rate" placeholder="e.g. $50-150/hr or fixed packages from $297">

      <button type="submit">Create provider profile (MVP)</button>
    </form>
    <p class="note">Frontend only. When live, this will feed into matching, messaging, reviews and dashboards.</p>
  </main>
</body>
</html>
