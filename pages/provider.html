<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Provider</title><link rel="stylesheet" href="../css/app.css"></head><body><header><a class="logo" href="../index.html">ServiceHub Global</a></header><main class="wrap" style="max-width:640px;"><h1>Provider profile</h1><p class="ok" id="ok">Profile saved locally.</p><form id="f"><label>Display name</label><input id="name" required><label>Skills</label><input id="skills" required><label>Rate</label><input id="rate"><label>Bio</label><textarea id="bio" required></textarea><button class="btn" type="submit" style="margin-top:1.2rem;width:100%;">Save profile</button></form></main><script src="../js/store.js"></script><script>document.getElementById("f").onsubmit=function(e){e.preventDefault();SHG.addProvider({name:name.value,skills:skills.value,rate:rate.value,bio:bio.value});document.getElementById("ok").style.display="block";this.reset();};</script></body></html>
