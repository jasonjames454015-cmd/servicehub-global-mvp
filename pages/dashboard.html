<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard</title><link rel="stylesheet" href="../css/app.css"></head><body><header><a class="logo" href="../index.html">ServiceHub Global</a><nav><a href="admin.html">Admin</a></nav></header><main class="wrap"><h1>Local dashboard</h1><p class="muted">Revenue remains $0 until a real payment is recorded.</p><h2>Requests</h2><div id="req"></div><h2>Providers</h2><div id="prov"></div></main><script src="../js/store.js"></script><script>const d=SHG.load();function table(rows,cols){if(!rows.length)return "<p class='muted'>None yet.</p>";let h="<table><tr>"+cols.map(c=>"<th>"+c+"</th>").join("")+"</tr>";rows.forEach(r=>{h+="<tr>"+cols.map(c=>"<td>"+(r[c]||"")+"</td>").join("")+"</tr>";});return h+"</table>";}document.getElementById("req").innerHTML=table(d.requests,["createdAt","category","title","budget","status"]);document.getElementById("prov").innerHTML=table(d.providers,["createdAt","name","skills","rate"]);</script></body></html>
